name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*" # Triggers on tag pushes like v1.0.0

permissions:
  contents: write # Required to upload files to Releases

env:
  FLUTTER_VERSION: "3.38.8"

jobs:
  build-and-release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Print tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Nexc-release.apk
          sha256sum dist/Nexc-release.apk > dist/Nexc-release.apk.sha256
          echo "### APK checksum" >> "$GITHUB_STEP_SUMMARY"
          cat dist/Nexc-release.apk.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Warn about signing
        run: echo "::warning::Release APK is signed with the Android debug key until release signing is configured."

      # Manual runs without a tag only exercise the build.
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: nexc-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Extract release notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Nexc-release.apk
            dist/Nexc-release.apk.sha256
          body: ${{ steps.extract_notes.outputs.release_notes }}
          append_body: true
