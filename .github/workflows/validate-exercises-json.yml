name: Validate exercises JSON

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/exercises.json"
      - "schemas/exercises-schema.json"
      - ".github/workflows/validate-exercises-json.yml"
  pull_request:
    paths:
      - "assets/exercises.json"
      - "schemas/exercises-schema.json"
      - ".github/workflows/validate-exercises-json.yml"

jobs:
  validate:
    name: Validate assets/exercises.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON file
        run: npx --yes ajv-cli@5 validate -s schemas/exercises-schema.json -d assets/exercises.json
